[package]
name = "evergreen"
version = "0.1.0"
edition = "2021"
description = "Bootstrap interpreter for the Evergreen language"
license = "MIT"

[[bin]]
name = "evg"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"], optional = true }
sha2 = "0.10.9"
